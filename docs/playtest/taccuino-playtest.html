<title>Taccuino del playtest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Taccuino da tenere in mano durante il test: barra fissa in alto (sessione e fase), contenuto a una colonna, schede in basso. */
:root {
  --paper: #F6F3FF; --card: #FFFFFF; --ink: #17122B; --muted: #5E5880; --line: #E2DCF5;
  --yellow: #FFD23F; --lilac: #B79CFF; --mint: #6EE7A8; --coral: #FF8A65; --sky: #5CD0FF; --pink: #FF7EB6;
  --danger: #C4300F; --chip: #EDE8FB; --on-accent: #17122B;
  --display: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif;
  --body: Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #15122B; --card: #211C3B; --ink: #F3F0FF; --muted: #B7B0D8; --line: #3A3360; --chip: #2C2650; --danger: #FF8A6B; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #15122B; --card: #211C3B; --ink: #F3F0FF; --muted: #B7B0D8; --line: #3A3360; --chip: #2C2650; --danger: #FF8A6B; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; text-wrap: balance; line-height: 1.1; }
h2 { font-size: 22px; }
h3 { font-size: 16px; }
p { margin: 0; text-wrap: pretty; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 2px solid var(--line); padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess-btn { border: 2px solid var(--ink); background: var(--yellow); color: var(--on-accent); border-radius: 999px; height: 36px; padding: 0 12px; font-weight: 800; font-size: 13px; white-space: nowrap; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.phases { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.phases::-webkit-scrollbar { display: none; }
.phase { flex: none; height: 34px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 13px; }
.phase[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }

main { padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; max-width: 640px; margin: 0 auto; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 2px solid var(--line); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tab { border: 0; background: transparent; height: 48px; border-radius: 12px; font-weight: 800; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; }
.tab svg { width: 20px; height: 20px; }
.tab[aria-current="page"] { color: var(--ink); background: var(--chip); }

.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.qbtn { border: 2px solid var(--ink); border-radius: 14px; min-height: 52px; padding: 8px 10px; font-weight: 800; font-size: 14px; text-align: left; background: var(--card); box-shadow: 0 3px 0 var(--ink); line-height: 1.2; }
.qbtn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.qbtn .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1.5px solid var(--ink); vertical-align: 1px; }
.qbtn.wide { grid-column: 1 / -1; text-align: center; }

.btn { border: 2px solid var(--ink); border-radius: 14px; height: 46px; padding: 0 16px; font-weight: 800; background: var(--card); box-shadow: 0 3px 0 var(--ink); white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--yellow); color: var(--on-accent); }
.btn.ghost { border-color: var(--line); box-shadow: none; }
.btn.danger { color: var(--danger); border-color: var(--danger); box-shadow: none; }
.btn.full { width: 100%; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 36px; min-width: 44px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--lilac); color: var(--on-accent); }
.chip.p0[aria-pressed="true"] { background: #FF5E3A; color: #fff; }
.chip.p1[aria-pressed="true"] { background: var(--coral); }
.chip.p2[aria-pressed="true"] { background: var(--yellow); }
.chip.p3[aria-pressed="true"] { background: var(--sky); }

label.field { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 13px; color: var(--muted); }
input[type=text], textarea, select { width: 100%; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); padding: 10px 12px; font-size: 16px; color: var(--ink); }
textarea { min-height: 76px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--ink); outline: none; }

.event { border: 2px solid var(--line); border-radius: 16px; background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; }
.event-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: var(--muted); }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; border: 1.5px solid var(--ink); font-size: 11px; font-weight: 800; color: var(--on-accent); white-space: nowrap; }
.event-text { font-size: 15px; overflow-wrap: anywhere; }

.timer { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.timer:last-child { border-bottom: 0; }
.timer-val { font-family: var(--display); font-size: 22px; font-weight: 800; min-width: 74px; text-align: right; }
.running { color: var(--danger); }

.check { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: transparent; height: 38px; padding: 0 12px; font-weight: 700; font-size: 13px; min-width: 44px; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--display); font-size: 24px; line-height: 1; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 700; }

.hyp { border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 4px; }
.hyp:last-child { border-bottom: 0; }
.strength { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }

.sheet-wrap { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; }
.sheet-bg { position: absolute; inset: 0; background: rgba(23, 18, 43, .55); }
.sheet { position: relative; width: 100%; max-width: 640px; margin: 0 auto; max-height: calc(100% - 24px); overflow-y: auto; background: var(--card); border-top: 2px solid var(--ink); border-radius: 22px 22px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.empty { text-align: center; padding: 24px 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
details summary { cursor: pointer; font-weight: 800; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

      ta.addEventListener('blur', () => { clearTimeout(debouncers[`dom-${g}-${i}`]); if ((risposte[i + 1] || '') !== ta.value) updSess({ domande: { [g]: { [i + 1]: ta.value } } }); });
      return h('label', { class: 'field' }, `${i + 1}. ${q}`, ta);
    }),
  ];
}

// ---------------- ipotesi ----------------
function viewIpotesi() {
  const n = (id) => S.eventi.filter((e) => (e.ipotesi || []).includes(id)).length;
  const col = { forte: 'var(--danger)', media: 'var(--muted)', debole: 'var(--muted)' };
  return [
    h('div', { class: 'card' },
      h('h2', {}, 'Ipotesi da verificare'),
      h('p', { class: 'muted small' }, 'Sono sospetti, non problemi confermati. Non vanno lette ai giocatori. Quando un evento riguarda un\'ipotesi, collegala nei dettagli dell\'evento: dopo il test diventano confermate, smentite o non verificate.'),
    ),
    h('div', { class: 'card' }, IPOTESI.map(([id, forza, titolo, guardare]) => h('div', { class: 'hyp' },
      h('div', { class: 'row' }, h('b', { class: 'num' }, id), h('span', { class: 'strength', style: `color:${col[forza]}` }, forza), h('span', { class: 'grow' }), n(id) ? h('span', { class: 'pill', style: 'background:var(--lilac)' }, `${n(id)} eventi`) : null),
      h('div', { style: 'font-weight:700' }, titolo),
      h('div', { class: 'small muted' }, 'Guardare: ' + guardare),
    ))),
  ];
}

// ---------------- prova: giocatori, definizione di fatto, esportazione ----------------
function viewProva() {
  const p = S.prova;
  const input = (id, value, placeholder, onSave) => {
    const el = h('input', { type: 'text', id, placeholder, value: value || '' });
    el.addEventListener('input', () => later(id, 700, () => onSave(el.value)));
    el.addEventListener('blur', () => { clearTimeout(debouncers[id]); if ((value || '') !== el.value) onSave(el.value); });
    return el;
  };
  const note = h('textarea', { id: 'prova-note', placeholder: 'Luogo, condizioni, cose da ricordare' });
  note.value = p.note || '';
  note.addEventListener('input', () => later('prova-note', 900, () => updProva({ note: note.value })));
  const dodFatti = DOD.filter((d) => p.dod?.[key(0, d)]).length;
  return [
    h('div', { class: 'card' },
      h('h2', {}, 'Giocatori'),
      h('p', { class: 'muted small' }, 'Bastano iniziali o soprannomi. Telefono e rete servono a capire le differenze tra dispositivi.'),
      GIOCATORI.map((g) => h('div', { class: 'stack', style: 'padding:8px 0;border-bottom:1px solid var(--line)' },
        h('b', {}, `Giocatore ${g}`),
        input(`g-${g}-nome`, p.giocatori?.[g]?.nome, 'Nome o iniziali', (v) => updProva({ giocatori: { [g]: { nome: v } } })),
        h('div', { class: 'row' },
          h('div', { class: 'grow' }, input(`g-${g}-tel`, p.giocatori?.[g]?.telefono, 'Telefono (es. iPhone 13)', (v) => updProva({ giocatori: { [g]: { telefono: v } } }))),
          h('div', { class: 'grow' }, input(`g-${g}-rete`, p.giocatori?.[g]?.rete, 'Rete (Wi-Fi o mobile)', (v) => updProva({ giocatori: { [g]: { rete: v } } }))),
        ),
      )),
    ),
    h('div', { class: 'card' }, h('h3', {}, 'Note sulla prova'), note),
    h('div', { class: 'card' },
      h('div', { class: 'row' }, h('h2', { class: 'grow' }, 'Il test è completo quando'), h('span', { class: 'muted small num' }, `${dodFatti} di ${DOD.length}`)),
      h('div', {}, DOD.map((d) => { const k = key(0, d); return h('div', { class: 'check' }, h('span', {}, d), seg(SI_NO, p.dod?.[k], (v) => updProva({ dod: { [k]: p.dod?.[k] === v ? null : v } }))); })),
    ),
    h('div', { class: 'card' },
      h('h3', {}, 'Passare i dati a Claude'),
      h('p', { class: 'muted small' }, 'Claude legge il taccuino direttamente. Se preferisci incollarlo in chat, copia tutto qui sotto.'),
      h('button', { class: 'btn full', type: 'button', onclick: copiaTutto }, 'Copia tutto come testo'),
    ),
  ];
}
function testoCompleto() {
  const p = S.prova, out = [];
  out.push(`# Playtest Nomi Cose Città (${new Date(p.creataIl).toLocaleDateString('it-IT')})`, '');
  out.push('## Giocatori');
  GIOCATORI.forEach((g) => { const x = p.giocatori?.[g] || {}; out.push(`- ${g}: ${x.nome || '-'} · ${x.telefono || '-'} · ${x.rete || '-'}`); });
  if (p.note) out.push('', 'Note: ' + p.note);
  for (const s of S.sessioni) {
    out.push('', `## S${s.n} · ${s.titolo} (iniziata alle ${fmtOra(s.creataIl)})`);
    TEMPI.forEach(([k, l]) => { const t = s.tempi?.[k]; if (t?.inizio) out.push(`- ${l}: ${t.fine ? fmtDur(t.fine - t.inizio) : 'non fermato'}`); });
    GIRI.forEach(([k, l]) => { const a = (s.giri?.[k] || []).filter((g) => g.fine); if (a.length) out.push(`- ${l}: ${a.map((g) => fmtDur(g.fine - g.inizio)).join(', ')}`); });
    ESITI.forEach(([k, l]) => { if (s.esiti?.[k]) out.push(`- ${l} ${s.esiti[k]}`); });
    const def = CHECK[s.n];
    def.gruppi.forEach(([titolo, items]) => items.forEach((it) => { const v = s.checklist?.[key(s.n, it)]; if (v) out.push(`- [${titolo}] ${it}: ${v}`); }));
    const ev = S.eventi.filter((e) => e.sessione === s.id).slice().reverse();
    if (ev.length) out.push('', '### Eventi');
    ev.forEach((e) => out.push(`- ${fmtOra(e.at)} · ${e.fase} · ${(TIPO[e.tipo] || TIPO.altro).t}${e.impatto ? ' · ' + e.impatto : ''}${(e.giocatori || []).length ? ' · ' + e.giocatori.join(',') : ''}${(e.ipotesi || []).length ? ' · ' + e.ipotesi.join(' ') : ''}: ${e.cosa}${e.atteso ? ` | atteso: ${e.atteso}` : ''}${e.reale ? ` | reale: ${e.reale}` : ''}${e.frequenza ? ` | frequenza: ${e.frequenza}` : ''}${e.riproducibile ? ` | riproducibile: ${e.riproducibile}` : ''}`));
    const dom = s.domande || {};
    const conRisposte = GIOCATORI.filter((g) => Object.values(dom[g] || {}).some((v) => v));
    if (conRisposte.length) out.push('', '### Domande finali');
    conRisposte.forEach((g) => { out.push(`**${g}**`); DOMANDE.forEach((q, i) => { const r = dom[g]?.[i + 1]; if (r) out.push(`- ${q} ${r}`); }); });
  }
  out.push('', '## Definizione di fatto');
  DOD.forEach((d) => out.push(`- ${d}: ${p.dod?.[key(0, d)] || '-'}`));
  return out.join('\n');
}
async function copiaTutto() {
  const testo = testoCompleto();
  try { await navigator.clipboard.writeText(testo); toast('Copiato: incollalo in chat'); }
  catch (e) {
    const ta = h('textarea', { id: 'export', readonly: true, style: 'min-height:240px' }); ta.value = testo;
    sheet('Seleziona e copia', [ta, h('button', { class: 'btn', type: 'button', onclick: () => layer.replaceChildren() }, 'Chiudi')], () => layer.replaceChildren());
    setTimeout(() => { ta.focus(); ta.select(); }, 50);
  }
}

// ---------------- pannello dal basso ----------------
const layer = document.getElementById('layer');
function sheet(titolo, body, onClose) {
  const panel = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': titolo }, h('h2', {}, titolo), ...[].concat(body));
  layer.replaceChildren(h('div', { class: 'sheet-wrap' }, h('div', { class: 'sheet-bg', onclick: onClose }), panel));
  const esc = (ev) => { if (ev.key === 'Escape') { onClose(); document.removeEventListener('keydown', esc); } };
  document.addEventListener('keydown', esc);
}
</script>
